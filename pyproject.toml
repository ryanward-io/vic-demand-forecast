[project]
name = "vicdemand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan Ward", email = "wardyryan1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chronos-forecasting>=2",
    "fastapi>=0.162.0",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "statsforecast>=2.0.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

# CPU-only PyTorch (for Chronos): the default wheels bundle ~2 GB of CUDA we don't need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
